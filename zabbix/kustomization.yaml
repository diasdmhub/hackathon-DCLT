apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stack de métricas de infraestrutura do EKS: Zabbix Proxy (modo ativo) +
# Zabbix Agent2 (DaemonSet) + kube-state-metrics, todos outbound-only (só o
# proxy sai do cluster, porta 10051) - ver zabbix/README.md. Cluster-only:
# kubeadm-local usa um Zabbix Agent pré-existente, fora deste repositório
# (ver CLAUDE.md), então não há um "zabbix/" equivalente lá.

resources:
  - 000-namespace.yaml
  - 010-helmrepository.yaml
  - 020-helmrelease-zabbix.yaml
  - 021-helmrelease-kube-state-metrics.yaml
  - 030-k8s-api-reader.yaml
