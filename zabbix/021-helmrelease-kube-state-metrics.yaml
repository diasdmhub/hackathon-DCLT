# kube-state-metrics: expõe /metrics com o estado dos objetos do Kubernetes
# (nodes, deployments, pods...). É a peça que falta para usar as templates
# nativas do Zabbix "Kubernetes nodes by HTTP" / "Kubernetes cluster state
# by HTTP" (grupos de host "kubernetes_nodes"/"kubernetes_cluster", os mesmos
# já usados no dashboard local - ver doc/grafana/dashboard-solidarytech.json
# e zabbix/README.md). Valores padrão do chart bastam: só precisamos do
# Service (porta 8080) acessível via proxy da API do Kubernetes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: zabbix
spec:
  interval: 30m0s
  releaseName: kube-state-metrics
  chart:
    spec:
      chart: kube-state-metrics
      version: "8.1.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
