# Instala o AWS Load Balancer Controller, que reconcilia o CRD
# TargetGroupBinding usado em kube-aws/ para registrar os pods dos 3
# microsserviços nos target groups da NLB provisionada por terra/modules/nlb.
# clusterName/region precisam bater com var.name_prefix/var.aws_region de
# terra/terraform.tfvars (padrão "solidarytech"/"us-east-1"); ajuste se
# customizar esses valores lá.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  interval: 30m0s
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "3.5.0"
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
  values:
    clusterName: solidarytech-eks-cluster
    region: us-east-1
    serviceAccount:
      create: false
      name: aws-load-balancer-controller
