# ServiceAccount com IRSA (IAM Roles for Service Accounts) para o AWS Load
# Balancer Controller - ver terra/modules/lb-controller. serviceAccount.create
# é false no HelmRelease (020-helmrelease.yaml) justamente para o chart usar
# esta ServiceAccount em vez de criar a dele sem a anotação de role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: lb-controller
    Project: SolidaryTech
    Environment: dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REDACTED-AWS-ACCOUNT-ID:role/solidarytech-aws-load-balancer-controller-irsa
