apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: donation
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  image: docker.io/diasdmhub/donation
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: donation
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  imageRepositoryRef:
    name: donation
  filterTags:
    pattern: '^[0-9]{14}$'
  policy:
    numerical:
      order: asc
