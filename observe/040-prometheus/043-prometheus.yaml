apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observe
  labels:
    app: prometheus
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: secondary
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=168h"
            # Habilita o endpoint remote_write (desativado por padrão) para
            # receber as métricas de service-graph/span-metrics do Tempo
            - "--web.enable-remote-write-receiver"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
