apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Retenção subiu de 168h para 35d (ver 043-prometheus.yaml) para os
      # SLOs mensais, mas 2Gi segue de sobra: uso medido no cluster real foi
      # ~7MB/dia (49.8M acumulados nos 168h de retenção anteriores), o que
      # projeta ~250MB para 35d mesmo sem folga extra.
      storage: 2Gi
