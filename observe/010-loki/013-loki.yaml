apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observe
  labels:
    app: loki
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: secondary
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: docker.io/grafana/loki:latest
          args: ["-config.file=/etc/loki/config.yaml"]
          ports:
            - containerPort: 3100
            - containerPort: 9096
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
