apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
data:
  config.yaml: |
    server:
      http_listen_port: 3200

    # Recebe traces via OTLP gRPC, encaminhados pelo Alloy (único ponto de
    # entrada de telemetria; os microserviços não falam com o Tempo diretamente)
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    # Mesma retenção adotada no Loki (168h = 7 dias). No Tempo 3.x o bloco
    # "compactor" deixou de existir; a compactação/retenção é feita pelo
    # backend-scheduler/backend-worker.
    backend_scheduler:
      provider:
        compaction:
          compaction:
            block_retention: 168h

    # Desativa o envio de estatísticas anônimas à Grafana Labs
    usage_report:
      reporting_enabled: false
