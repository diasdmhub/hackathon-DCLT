zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 26b0b8ed7f8c4a0e9c7c2a0c9d6c5a11
      name: Templates/Applications
  templates:
    - uuid: 2ea320b75f2d4e8e8048fcd790d1fbf8
      template: 'SolidaryTech Health by HTTP'
      name: 'SolidaryTech Health by HTTP'
      description: 'Monitors the SolidaryTech services with HTTP checks'
      vendor:
        name: diasdm
        version: 7.4.12
      groups:
        - name: Templates/Applications
      items:
        - uuid: 1398d861196a4bbe934204cb8f302493
          name: 'SolidaryTech Donation Count'
          type: DEPENDENT
          key: 'st.donation[count]'
          history: 30d
          trends: 180d
          description: 'Number of donations registered in the platform.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: 'st.donation[list]'
          tags:
            - tag: Donation
              value: count
        - uuid: b64a5497720a4efbb5918b8c2252eda4
          name: 'SolidaryTech Donation List'
          type: HTTP_AGENT
          key: 'st.donation[list]'
          delay: 5m
          history: '0'
          value_type: TEXT
          description: 'Raw donation list, polled once and reused by the dependent donation count and total amount items below'
          timeout: 10s
          url: '{$ST.HTTP.SCHEMA}://{HOST.CONN}:{$ST.PORT.DONATION}/donations'
          tags:
            - tag: Donation
              value: list
        - uuid: c9b60496ed1546f48ade9c4885481640
          name: 'SolidaryTech Donation Total Amount'
          type: DEPENDENT
          key: 'st.donation[sum]'
          history: 30d
          value_type: FLOAT
          trends: 180d
          units: $
          description: 'Sum of the amount field across all donations.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[*].amount.sum()'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: 'st.donation[list]'
          tags:
            - tag: Donation
              value: total
          triggers:
            - uuid: f8ec6e0052374088b60c3c53ac9ed92a
              expression: 'changecount(/SolidaryTech Health by HTTP/st.donation[sum],{$ST.DONATION.PERIOD},"inc")=0'
              name: 'SolidaryTech No Donations'
              event_name: 'SolidaryTech No Donations for {$ST.DONATION.PERIOD}'
              opdata: 'Donations so far: {ITEM.LASTVALUE}'
              priority: WARNING
              description: 'No donations were detected in the last defined period'
              manual_close: 'YES'
              tags:
                - tag: Donation
                  value: absent
        - uuid: 8d181575dce64c468a2452d5abb79be3
          name: 'SolidaryTech NGO Count'
          type: DEPENDENT
          key: 'st.ngo[count]'
          history: 7d
          trends: 90d
          description: 'Number of NGOs registered in the platform'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: 'st.ngo[list]'
          tags:
            - tag: NGO
              value: count
        - uuid: 16eaa05a66a4469098384a6bee47bced
          name: 'SolidaryTech NGOs List'
          type: HTTP_AGENT
          key: 'st.ngo[list]'
          delay: 5m
          history: '0'
          value_type: TEXT
          description: 'Raw NGO list, polled once and reused by the dependent NGO count item and by the NGO discovery rule below'
          url: '{$ST.HTTP.SCHEMA}://{HOST.CONN}:{$ST.PORT.NGO}/ngos'
          tags:
            - tag: NGO
              value: list
        - uuid: 3d369ce4a6004a76ae9c139ddd869f30
          name: 'SolidaryTech Health Service Donation'
          type: DEPENDENT
          key: 'st.status.health[donation]'
          history: 7d
          trends: 90d
          description: 'Health check for the Donation service'
          valuemap:
            name: 'Health Status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: STR_REPLACE
              parameters:
                - ok
                - '1'
          master_item:
            key: 'st.status[donation]'
          tags:
            - tag: Donation
              value: health
          triggers:
            - uuid: 36f98a5d99944e2b8222f2df44594ec2
              expression: 'max(/SolidaryTech Health by HTTP/st.status.health[donation],#2)=0'
              name: 'SolidaryTech Health Service Unavailable Donation'
              opdata: 'Service Status: {ITEM.LASTVALUE}'
              priority: HIGH
              description: 'Service health status is not available'
              dependencies:
                - name: 'SolidaryTech Health Services All Unavailable'
                  expression: 'sum(last(/SolidaryTech Health by HTTP/st.status.health[donation],#1),last(/SolidaryTech Health by HTTP/st.status.health[ngo],#1),last(/SolidaryTech Health by HTTP/st.status.health[volunteer],#1))<1'
              tags:
                - tag: Donation
                  value: unavailable
        - uuid: 6035b4f1a6f7454cabb792d1af55b636
          name: 'SolidaryTech Health Service NGO'
          type: DEPENDENT
          key: 'st.status.health[ngo]'
          history: 7d
          trends: 90d
          description: 'Health check for the NGO service'
          valuemap:
            name: 'Health Status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: STR_REPLACE
              parameters:
                - ok
                - '1'
          master_item:
            key: 'st.status[ngo]'
          tags:
            - tag: NGO
              value: health
          triggers:
            - uuid: bdb8d0d68efc4291bb45b71bf0db0c16
              expression: 'max(/SolidaryTech Health by HTTP/st.status.health[ngo],#2)=0'
              name: 'SolidaryTech Health Service Unavailable NGO'
              opdata: 'Service Status: {ITEM.LASTVALUE}'
              priority: HIGH
              description: 'NGO Service health status is not available'
              dependencies:
                - name: 'SolidaryTech Health Services All Unavailable'
                  expression: 'sum(last(/SolidaryTech Health by HTTP/st.status.health[donation],#1),last(/SolidaryTech Health by HTTP/st.status.health[ngo],#1),last(/SolidaryTech Health by HTTP/st.status.health[volunteer],#1))<1'
              tags:
                - tag: NGO
                  value: unavailable
        - uuid: f462aeae03924616814ad09a6722aeaa
          name: 'SolidaryTech Health Service Volunteer'
          type: DEPENDENT
          key: 'st.status.health[volunteer]'
          history: 7d
          trends: 90d
          description: 'Health check for the Volunteer service'
          valuemap:
            name: 'Health Status'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: STR_REPLACE
              parameters:
                - ok
                - '1'
          master_item:
            key: 'st.status[volunteer]'
          tags:
            - tag: Volunteer
              value: health
          triggers:
            - uuid: 6b0ad1b63bbe43799a28697aad97e982
              expression: 'max(/SolidaryTech Health by HTTP/st.status.health[volunteer],#2)=0'
              name: 'SolidaryTech Health Service Unavailable Volunteer'
              opdata: 'Service Status: {ITEM.LASTVALUE}'
              priority: HIGH
              description: 'Volunteer Service health status is not available'
              dependencies:
                - name: 'SolidaryTech Health Services All Unavailable'
                  expression: 'sum(last(/SolidaryTech Health by HTTP/st.status.health[donation],#1),last(/SolidaryTech Health by HTTP/st.status.health[ngo],#1),last(/SolidaryTech Health by HTTP/st.status.health[volunteer],#1))<1'
              tags:
                - tag: Volunteer
                  value: unavailable
        - uuid: 566066b7253e4e09af99be2d78dd4863
          name: 'SolidaryTech Latency Service Donation'
          type: DEPENDENT
          key: 'st.status.latency[donation]'
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: s
          description: 'Round-trip latency of the HTTP call to the Donation service health endpoint'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.latency
          master_item:
            key: 'st.status[donation]'
          tags:
            - tag: Donation
              value: latency
        - uuid: 316905cf55434c4590391b78722550b0
          name: 'SolidaryTech Latency Service NGO'
          type: DEPENDENT
          key: 'st.status.latency[ngo]'
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: s
          description: 'Round-trip latency of the HTTP call to the NGO service health endpoint'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.latency
          master_item:
            key: 'st.status[ngo]'
          tags:
            - tag: NGO
              value: latency
        - uuid: e0ec54e372254cf1bbd78079be129a8b
          name: 'SolidaryTech Latency Service Volunteer'
          type: DEPENDENT
          key: 'st.status.latency[volunteer]'
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: s
          description: 'Round-trip latency of the HTTP call to the Volunteer service health endpoint'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.latency
          master_item:
            key: 'st.status[volunteer]'
          tags:
            - tag: Volunteer
              value: latency
        - uuid: 2713ea34bac649f0a110dea2e0088795
          name: 'SolidaryTech Status Service Donation'
          type: SCRIPT
          key: 'st.status[donation]'
          history: '0'
          value_type: TEXT
          params: |
            try {
                var params = JSON.parse(value);
                var req = new HttpRequest();
                var start = Date.now();
                var body;
                var result = {status: 0};
            
                try {
                    body = req.get(params.url);
                    result.latency = ( Date.now() - start ) / 1000;
                }
                catch (err) {
                    return JSON.stringify(result);
                }
            
                try {
                    result.status = JSON.parse(body).status;
                }
                catch (err) {
                    result.status = 0;
                }
            
                return JSON.stringify(result);
            }
            catch (error) {
                Zabbix.log(3, 'SolidaryTech Health check failed: ' + error);
                throw 'SolidaryTech Health check failed: ' + error;
            }
          description: 'Raw health check payload for the Donation service'
          parameters:
            - name: url
              value: '{$ST.HTTP.SCHEMA}://{HOST.CONN}:{$ST.PORT.DONATION}/health'
          tags:
            - tag: Health
              value: donation
        - uuid: a11d4d65c94144f5b9a42b1893faa4ce
          name: 'SolidaryTech Status Service NGO'
          type: SCRIPT
          key: 'st.status[ngo]'
          history: '0'
          value_type: TEXT
          params: |
            try {
                var params = JSON.parse(value);
                var req = new HttpRequest();
                var start = Date.now();
                var body;
                var result = {status: 0};
            
                try {
                    body = req.get(params.url);
                    result.latency = ( Date.now() - start ) / 1000;
                }
                catch (err) {
                    return JSON.stringify(result);
                }
            
                try {
                    result.status = JSON.parse(body).status;
                }
                catch (err) {
                    result.status = 0;
                }
            
                return JSON.stringify(result);
            }
            catch (error) {
                Zabbix.log(3, 'SolidaryTech Health check failed: ' + error);
                throw 'SolidaryTech Health check failed: ' + error;
            }
          description: 'Raw health check payload for the NGO service'
          parameters:
            - name: url
              value: '{$ST.HTTP.SCHEMA}://{HOST.CONN}:{$ST.PORT.NGO}/health'
          tags:
            - tag: Health
              value: ngo
        - uuid: ef9c4ac69ef9438ab89a337f679ba617
          name: 'SolidaryTech Status Service Volunteer'
          type: SCRIPT
          key: 'st.status[volunteer]'
          history: '0'
          value_type: TEXT
          params: |
            try {
                var params = JSON.parse(value);
                var req = new HttpRequest();
                var start = Date.now();
                var body;
                var result = {status: 0};
            
                try {
                    body = req.get(params.url);
                    result.latency = ( Date.now() - start ) / 1000;
                }
                catch (err) {
                    return JSON.stringify(result);
                }
            
                try {
                    result.status = JSON.parse(body).status;
                }
                catch (err) {
                    result.status = 0;
                }
            
                return JSON.stringify(result);
            }
            catch (error) {
                Zabbix.log(3, 'SolidaryTech Health check failed: ' + error);
                throw 'SolidaryTech Health check failed: ' + error;
            }
          description: 'Raw health check payload for the Volunteer service'
          parameters:
            - name: url
              value: '{$ST.HTTP.SCHEMA}://{HOST.CONN}:{$ST.PORT.VOLUNTEER}/health'
          tags:
            - tag: Health
              value: volunteer
      discovery_rules:
        - uuid: 3cffea3fc5094d69ae38021eca4bd773
          name: 'SolidaryTech NGO Discovery'
          type: DEPENDENT
          key: 'st.ngo[discovery]'
          lifetime_type: DELETE_IMMEDIATELY
          description: 'Discovers the NGOs currently registered'
          item_prototypes:
            - uuid: 798aae440b7e4f17913e90c210a7176c
              name: 'SolidaryTech Volunteers Count for {#ST.NGO.NAME}'
              type: HTTP_AGENT
              key: 'st.volunteers.count[{#ST.NGO.ID}]'
              delay: 1h
              history: 14d
              trends: 180d
              description: 'Number of volunteers registered for NGO {#ST.NGO.NAME} (id {#ST.NGO.ID})'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.length()
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              url: '{$ST.HTTP.SCHEMA}://{HOST.CONN}:{$ST.PORT.VOLUNTEER}/volunteers/{#ST.NGO.ID}'
              tags:
                - tag: NGO
                  value: '{#ST.NGO.ID}'
                - tag: Volunteer
                  value: count
          master_item:
            key: 'st.ngo[list]'
          lld_macro_paths:
            - lld_macro: '{#ST.NGO.ID}'
              path: $.id
            - lld_macro: '{#ST.NGO.NAME}'
              path: $.name
      tags:
        - tag: SolidaryTech
          value: health
      macros:
        - macro: '{$ST.DONATION.PERIOD}'
          value: 1d
          description: 'Donation amount evaluation period'
        - macro: '{$ST.HTTP.SCHEMA}'
          value: http
          description: 'HTTP service schema (http or https)'
        - macro: '{$ST.PORT.DONATION}'
          value: '8082'
          description: 'Donation service TCP port'
        - macro: '{$ST.PORT.NGO}'
          value: '8081'
          description: 'NGO service TCP port'
        - macro: '{$ST.PORT.VOLUNTEER}'
          value: '8083'
          description: 'Volunteer service TCP port'
      valuemaps:
        - uuid: c3b65a2c5a424aad92bf3229ba560374
          name: 'Health Status'
          mappings:
            - value: '1'
              newvalue: Ok
            - type: DEFAULT
              newvalue: Unavailable
  triggers:
    - uuid: 2d3fb0a0913f42aeb261b74d9f4a7b14
      expression: 'sum(last(/SolidaryTech Health by HTTP/st.status.health[donation],#1),last(/SolidaryTech Health by HTTP/st.status.health[ngo],#1),last(/SolidaryTech Health by HTTP/st.status.health[volunteer],#1))<1'
      name: 'SolidaryTech Health Services All Unavailable'
      opdata: 'Service Status: {ITEM.LASTVALUE}'
      priority: DISASTER
      description: 'All services from SolidaryTech are not available'
      tags:
        - tag: Services
          value: unavailable
