                throw 'SolidaryTech Load volunteer create failed: ' + error;
            }
          description: 'Registers one volunteer twice a day for a randomly picked, already existing NGO.'
          parameters:
            - name: host
              value: '{HOST.CONN}'
            - name: port_ngo
              value: '{$ST.PORT.NGO}'
            - name: port_volunteer
              value: '{$ST.PORT.VOLUNTEER}'
            - name: schema
              value: '{$ST.HTTP.SCHEMA}'
          tags:
            - tag: Load
              value: volunteer
      tags:
        - tag: SolidaryTech
          value: load
      macros:
        - macro: '{$ST.HTTP.SCHEMA}'
          value: http
          description: 'HTTP service schema (http or https)'
        - macro: '{$ST.PORT.DONATION}'
          value: '8082'
          description: 'Donation service TCP port'
        - macro: '{$ST.PORT.NGO}'
          value: '8081'
          description: 'NGO service TCP port'
        - macro: '{$ST.PORT.VOLUNTEER}'
          value: '8083'
          description: 'Volunteer service TCP port'