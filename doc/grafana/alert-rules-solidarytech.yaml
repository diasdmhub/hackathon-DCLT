groups:
  - name: solidarytech-alerts
    interval: 1m
    rules:
      - alert: solidarytech-donation-error-rate
        expr: >-
          (100 * sum(rate(traces_spanmetrics_calls_total{service="donation-service", status_code="STATUS_CODE_ERROR"}[5m]))
          / sum(rate(traces_spanmetrics_calls_total{service="donation-service"}[5m]))) > 2
        for: 5m
        labels:
          service: donation-service
          severity: critical
        annotations:
          summary: donation-service acima de 2% de erro em 5m
          description: >-
            O SLO do donation-service (doc/estrutura.md) é 98%, ou seja, error budget de 2%. Este
            alerta dispara junto com a quebra do error budget mensal.

      - alert: solidarytech-pods-unavailable
        expr: >-
          (kube_deployment_spec_replicas{namespace="solidarytech"}
          - kube_deployment_status_replicas_available{namespace="solidarytech"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Deployment com menos replicas disponiveis do que o especificado
          description: >-
            Diferenca entre replicas especificadas e disponiveis (por deployment) sustentada ha 5 minutos.
            Verificar rollout, crash loop ou falha de readiness probe.

      - alert: solidarytech-donation-silence
        expr: sum(rate(traces_spanmetrics_calls_total{service="donation-service"}[15m])) <= 0
        for: 30m
        labels:
          service: donation-service
          severity: warning
        annotations:
          summary: Nenhuma chamada ao donation-service nos ultimos 15 minutos
          description: >-
            RED e saude de pods podem estar normais mesmo com o fluxo de doacoes parado (ex.: falha
            silenciosa na publicacao SQS, problema de roteamento no NLB/Ingress antes do servico).
            Considerar Mute Timing para horarios sem uso esperado.
