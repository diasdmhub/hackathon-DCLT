apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app: volunteer
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunteer
  template:
    metadata:
      labels:
        app: volunteer
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: primary
    spec:
      serviceAccountName: volunteer-service
      containers:
        - name: volunteer
          # Não gerenciada pelo Flux Image Automation neste cluster (só
          # habilitado em kubeadm-local - ver clusters/eks-aws/), por isso
          # :latest em vez de uma tag de timestamp fixa.
          image: docker.io/diasdmhub/volunteer:latest
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: volunteer-env
          # Tracing OTLP exportado ao Alloy (namespace observe), que roteia ao Tempo
          env:
            - name: OTEL_SERVICE_NAME
              value: volunteer-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observe.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Exclui as sondas de liveness/readiness dos traces
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: /health
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
spec:
  # ClusterIP, não LoadBalancer: a exposição externa é a NLB única
  # provisionada por terra/modules/nlb, via TargetGroupBinding abaixo - ver
  # kube-aws/README.md.
  type: ClusterIP
  selector:
    app: volunteer
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
spec:
  serviceRef:
    name: volunteer
    port: 8083
  # Nome determinístico ("${name_prefix}-volunteer-tg" em terra/modules/nlb) -
  # dispensa copiar o ARN gerado pela AWS depois do terraform apply.
  targetGroupName: solidarytech-volunteer-tg
  targetType: ip
