# Exemplo do Secret que o Deployment volunteer (062-volunteer.yaml) espera
# via envFrom. Diferente de ngo-env/donation-env, este arquivo não precisa
# de cópia com valores reais preenchidos manualmente: AWS_DYNAMODB_TABLE já
# é o nome real da tabela criada pelo Terraform (module "dynamo" em
# terra/main.tf) e não é sensível. Ainda assim, mantenha o padrão de aplicar
# manualmente (kubectl apply -f 061-secret.yaml), fora do Flux, por
# consistência com ngo-env/donation-env - ver kube-aws/README.md.
#
# Sem AWS_ENDPOINT_URL nem AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY: a
# autenticação é via IRSA, através da ServiceAccount volunteer-service (ver
# 005-serviceaccounts.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: volunteer-env
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
type: Opaque
stringData:
  PORT: "8083"
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "SolidaryTechVolunteers"
