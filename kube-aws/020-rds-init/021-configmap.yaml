# Cópia do schema (CREATE TABLE IF NOT EXISTS + seed idempotente) usado
# pelo ngo-service e pelo donation-service - ver 022-rds-init.yaml. Não é
# gerado a partir de build/*-service/db/init.sql via configMapGenerator
# porque o kustomize recusa arquivos fora da raiz do kustomization (mesmo
# via symlink, o caminho real é resolvido antes da checagem). Se
# build/ngo-service/db/init.sql ou build/donation-service/db/init.sql
# mudarem, atualize as cópias abaixo também.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-init-sql
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
data:
  ngo-init.sql: |
    CREATE TABLE IF NOT EXISTS ngos (
        id SERIAL PRIMARY KEY,
        name VARCHAR(150) NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        cause VARCHAR(100) NOT NULL, -- Ex: Proteção Animal, Educação, Fome
        city VARCHAR(100) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    --- Incluída idempotência mínima
    INSERT INTO ngos (name, email, cause, city) VALUES
    ('Anjos de Patas', 'contato@anjosdepatas.org', 'Proteção Animal', 'Osasco'),
    ('Educa Mais', 'info@educamais.org', 'Educação', 'São Paulo')
    ON CONFLICT (email) DO NOTHING;
  donation-init.sql: |
    CREATE TABLE IF NOT EXISTS donations (
        id SERIAL PRIMARY KEY,
        ngo_id INT NOT NULL,
        amount NUMERIC(10, 2) NOT NULL,
        donor_name VARCHAR(100) NOT NULL,
        status VARCHAR(20) NOT NULL, -- Ex: APPROVED, PENDING
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
