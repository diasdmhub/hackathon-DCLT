# ServiceAccounts com IRSA (IAM Roles for Service Accounts), assumidas via
# webhook do EKS a partir do OIDC provider do cluster - ver terra/modules/iam.
# O AWS SDK (Go e Python) usa o token web identity injetado automaticamente
# nesses pods para se autenticar; por isso os Secrets donation-env/
# volunteer-env deste diretório não têm AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# (diferente de kube/, que usa credenciais falsas para os emuladores locais).
#
# ${DONATION_SERVICE_ROLE_ARN}/${VOLUNTEER_SERVICE_ROLE_ARN} não são
# expandidas pelo Kustomize - vêm do postBuild.substituteFrom do Kustomization
# `solidarytech` (clusters/eks-aws/solidarytech-kustomization.yaml), que lê o
# Secret `irsa-role-arns` em flux-system (contém os ARNs reais, incluindo o
# account ID da AWS - por isso não ficam hardcoded aqui num repositório
# público; ver clusters/eks-aws/flux-system/irsa-role-arns-secret.example.yaml
# e doc/roteiro-cluster-aws.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donation-service
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: Production
  annotations:
    eks.amazonaws.com/role-arn: ${DONATION_SERVICE_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volunteer-service
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: Production
  annotations:
    eks.amazonaws.com/role-arn: ${VOLUNTEER_SERVICE_ROLE_ARN}
