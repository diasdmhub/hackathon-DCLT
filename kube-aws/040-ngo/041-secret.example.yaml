# Exemplo do Secret que o Deployment ngo (042-ngo.yaml) espera via envFrom.
# NÃO aplique este arquivo como está - copie-o para 041-secret.yaml, troque
# DATABASE_URL pela URL real de conexão do RDS e aplique manualmente
# (kubectl apply -f 041-secret.yaml), fora do Flux. Este diretório não tem
# um 041-secret.yaml real propositalmente: contém a senha do RDS, diferente
# de kube/, onde psql roda no próprio cluster com credenciais fixas de
# desenvolvimento. Não deve ir para o git - ver kube-aws/README.md.
#
# Onde encontrar o valor:
#   terraform output rds_outputs   (em terra/, campo rds_connection_url)
# ou, caso prefira ler direto do SSM Parameter Store que o Terraform já
# populou (module "secrets" em terra/main.tf):
#   aws ssm get-parameter --name /solidarytech/aws/rds/connection_url \
#     --with-decryption --query Parameter.Value --output text
apiVersion: v1
kind: Secret
metadata:
  name: ngo-env
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
type: Opaque
stringData:
  PORT: "8081"
  DATABASE_URL: "CHANGE_ME"
