apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app: ngo
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: Production
spec:
  # Sem "replicas" fixo: a contagem passa a ser controlada pelo HPA
  # (043-hpa.yaml). Se o campo ficasse aqui, a cada reconciliação da
  # Kustomization "solidarytech" (5m) o Flux reaplicaria o valor fixo,
  # brigando com o HPA.
  selector:
    matchLabels:
      app: ngo
  template:
    metadata:
      labels:
        app: ngo
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: Production
    spec:
      # Preferencial (não hard) para não travar o rollout com só 2 nodes: um
      # required exigiria um 3º node livre durante o maxSurge do deploy.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ngo
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ngo
          # Não gerenciada pelo Flux Image Automation neste cluster (só
          # habilitado em kubeadm-local - ver clusters/eks-aws/), por isso
          # :latest em vez de uma tag de timestamp fixa.
          image: docker.io/diasdmhub/ngo:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: ngo-env
          # Tracing OTLP exportado ao Alloy (namespace observe), que roteia ao Tempo
          env:
            - name: OTEL_SERVICE_NAME
              value: ngo-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observe.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Exclui as sondas de liveness/readiness e as coletas do Prometheus dos traces
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: /health,/metrics
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app.kubernetes.io/name: ngo
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: Production
  annotations:
    # Descoberto pelo job "solidarytech-service-endpoints" em
    # terra/modules/prometheus/prometheus.yml (endpoint /metrics, mesma porta
    # do Service)
    prometheus.io/scrape: "true"
spec:
  # ClusterIP, não LoadBalancer: a exposição externa é a NLB única
  # provisionada por terra/modules/nlb, via TargetGroupBinding abaixo - ver
  # kube-aws/README.md.
  type: ClusterIP
  selector:
    app: ngo
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: Production
spec:
  serviceRef:
    name: ngo
    port: 8081
  # Nome determinístico ("${name_prefix}-ngo-tg" em terra/modules/nlb) -
  # dispensa copiar o ARN gerado pela AWS depois do terraform apply.
  targetGroupName: solidarytech-ngo-tg
  targetType: ip
