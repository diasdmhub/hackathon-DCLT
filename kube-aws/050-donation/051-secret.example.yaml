# Exemplo do Secret que o Deployment donation (052-donation.yaml) espera via
# envFrom. NÃO aplique este arquivo como está - copie-o para
# 051-secret.yaml, troque DATABASE_URL pela URL real de conexão do RDS e
# aplique manualmente (kubectl apply -f 051-secret.yaml), fora do Flux. Não
# deve ir para o git - ver kube-aws/README.md.
#
# AWS_SQS_URL já vem preenchido com a fila real criada pelo Terraform
# (module "sqs" em terra/main.tf, saída sqs_queue_url) - não é sensível.
# Diferente de kube/, não há AWS_ENDPOINT_URL nem AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY: a autenticação é via IRSA, através da ServiceAccount
# donation-service (ver 005-serviceaccounts.yaml) - deixar credenciais
# estáticas aqui quebraria essa autenticação, pois o AWS SDK confere
# variáveis de ambiente antes do token web identity da IRSA.
#
# Onde encontrar DATABASE_URL:
#   terraform output rds_outputs   (em terra/, campo rds_connection_url)
# ou:
#   aws ssm get-parameter --name /solidarytech/aws/rds/connection_url \
#     --with-decryption --query Parameter.Value --output text
apiVersion: v1
kind: Secret
metadata:
  name: donation-env
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
type: Opaque
stringData:
  PORT: "8082"
  DATABASE_URL: "CHANGE_ME"
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/177461238808/solidarytech-donation-events"
