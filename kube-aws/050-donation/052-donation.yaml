apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app: donation
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: donation
  template:
    metadata:
      labels:
        app: donation
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: primary
    spec:
      # Preferencial (não hard) para não travar o rollout com só 2 nodes: um
      # required exigiria um 3º node livre durante o maxSurge do deploy.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: donation
                topologyKey: kubernetes.io/hostname
      serviceAccountName: donation-service
      containers:
        - name: donation
          # Não gerenciada pelo Flux Image Automation neste cluster (só
          # habilitado em kubeadm-local - ver clusters/eks-aws/), por isso
          # :latest em vez de uma tag de timestamp fixa.
          image: docker.io/diasdmhub/donation:latest
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: donation-env
          # Tracing OTLP exportado ao Alloy (namespace observe), que roteia ao Tempo
          env:
            - name: OTEL_SERVICE_NAME
              value: donation-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observe.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
spec:
  # ClusterIP, não LoadBalancer: a exposição externa é a NLB única
  # provisionada por terra/modules/nlb, via TargetGroupBinding abaixo - ver
  # kube-aws/README.md.
  type: ClusterIP
  selector:
    app: donation
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: primary
spec:
  serviceRef:
    name: donation
    port: 8082
  # Nome determinístico ("${name_prefix}-donation-tg" em terra/modules/nlb) -
  # dispensa copiar o ARN gerado pela AWS depois do terraform apply.
  targetGroupName: solidarytech-donation-tg
  targetType: ip
