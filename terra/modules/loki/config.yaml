auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Buffer curto: o loki.write "grafanacloud" do Alloy (ver
# terra/modules/alloy/config.alloy.tpl) já duplica todos os logs para o
# Grafana Cloud, então o disco local não precisa mais reter histórico
# longo - só o suficiente para consulta/depuração local.
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  retention_period: 24h
  max_query_series: 5000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
