networks:
  sol-net:
    driver: bridge
    enable_ipv6: true

volumes:
  postgres:

services:
  elasticmq:
    image: docker.io/softwaremill/elasticmq-native:latest
    container_name: elasticmq
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf
#    ports:
#      - 9324:9324
    healthcheck:
      test: ["CMD-SHELL", "nc -z elasticmq 9324"]
      start_interval: 5s
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - sol-net

  dynamodb:
    image: docker.io/amazon/dynamodb-local:latest
    container_name: dynamodb
    # Opção sharedDb adicionada para usar um único arquivo de banco compartilhado
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
#    ports:
#      - 8000:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://dynamodb:8000"]
      start_interval: 5s
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - sol-net

  dynamodb-init:
    image: docker.io/amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      - dynamodb
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do
          echo "Aguardando o DynamoDB Local..."
          sleep 2
        done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name SolidaryTechVolunteers \
          --attribute-definitions AttributeName=volunteer_id,AttributeType=S \
          --key-schema AttributeName=volunteer_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          || echo "Tabela já existe, seguindo em frente."
    networks:
      - sol-net

  psql:
    build:
      dockerfile: Dockerfile-psql
#    image: docker.io/library/postgres:18-alpine
    container_name: postgresql
    restart: unless-stopped
#    ports:
#      - 5432:5432
    env_file: .env_psql
#    environment:
#      - POSTGRES_USER=${POSTGRES_USER}
#      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
#      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d sol_db"]
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sol-net

  ngo:
    build:
      dockerfile: Dockerfile-ngo
#    image: docker.io/library/python:3-alpine
    container_name: ngo-service
    env_file: .env_ngo
    ports:
      - 8081:8081
#    environment:
#      - DATABASE_URL=${DATABASE_URL}
#      - PORT=${PORT}
    depends_on:
      psql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://ngo:8081/health"]
      start_interval: 5s
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - sol-net

  donation:
    build:
      dockerfile: Dockerfile-donation
#    image: docker.io/library/golang:alpine
    container_name: donation-service
    env_file: .env_donation
    ports:
      - 8082:8082
#    environment:
#      - PORT=${PORT}
#      - DATABASE_URL=${DATABASE_URL}
#      - AWS_REGION=${AWS_REGION}
#      - AWS_SQS_URL=${AWS_SQS_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://donation:8082/health"]
      start_interval: 5s
      interval: 10s
      timeout: 2s
      retries: 3
    depends_on:
      psql:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    networks:
      - sol-net

  volunteer:
    build:
      dockerfile: Dockerfile-volunteer
#    image: docker.io/library/python:3-alpine
    container_name: volunteer-service
    env_file: .env_volunteer
    ports:
      - 8083:8083
#    environment:
#      - PORT=${PORT}
#      - AWS_REGION=${AWS_REGION}
#      - AWS_DYNAMODB_TABLE=${AWS_DYNAMODB_TABLE}
    depends_on:
      psql:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://volunteer:8083/health"]
      start_interval: 5s
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - sol-net