apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app: donation
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  # Sem "replicas" fixo: a contagem passa a ser controlada pelo HPA
  # (053-hpa.yaml). Se o campo ficasse aqui, a cada reconciliação da
  # Kustomization "solidarytech" (5m) o Flux reaplicaria o valor fixo,
  # brigando com o HPA.
  selector:
    matchLabels:
      app: donation
  template:
    metadata:
      labels:
        app: donation
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: secondary
    spec:
      # Preferencial (não hard) para não travar o rollout com só 2 nodes: um
      # required exigiria um 3º node livre durante o maxSurge do deploy.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: donation
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-psql
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 psql 5432; do
                echo "Aguardando o psql..."
                sleep 2
              done
        - name: wait-for-elasticmq
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 elasticmq 9324; do
                echo "Aguardando o elasticmq..."
                sleep 2
              done
      containers:
        - name: donation
          image: docker.io/diasdmhub/donation:20260823004734 # {"$imagepolicy": "flux-system:donation"}
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: donation-env
          # Tracing OTLP exportado ao Alloy (namespace observe), que roteia ao Tempo
          env:
            - name: OTEL_SERVICE_NAME
              value: donation-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observe.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app.kubernetes.io/name: donation
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
    # Descoberto pelo job "solidarytech-service-endpoints" em
    # observe/040-prometheus/prometheus.yml (endpoint /metrics, mesma porta do
    # Service)
    prometheus.io/scrape: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: donation
  ports:
    - port: 8082
      targetPort: 8082
