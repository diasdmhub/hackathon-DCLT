apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app: donation
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donation
  template:
    metadata:
      labels:
        app: donation
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: dev
    spec:
      initContainers:
        - name: wait-for-psql
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 psql 5432; do
                echo "Aguardando o psql..."
                sleep 2
              done
        - name: wait-for-elasticmq
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 elasticmq 9324; do
                echo "Aguardando o elasticmq..."
                sleep 2
              done
      containers:
        - name: donation
          image: docker.io/diasdmhub/donation:20260731011844 # {"$imagepolicy": "flux-system:donation"}
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: donation-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: donation
  ports:
    - port: 8082
      targetPort: 8082
