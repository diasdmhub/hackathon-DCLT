# min=2/max=4: mantém redundância mesmo em carga baixa (2 réplicas), o que
# permite ao PodDisruptionBudget (054-pdb.yaml) proteger de fato contra
# drain de node sem travar a manutenção indefinidamente - com 1 réplica só,
# nenhuma configuração de PDB consegue impedir indisponibilidade e liberar o
# drain ao mesmo tempo. Ainda escala até 4 réplicas sob pico de carga.
# Depende do metrics-server (observe/050-metrics-server/) para a API
# metrics.k8s.io.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donation
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
