# min=1/max=4: reduz o consumo de CPU/memória nos nodes quando a carga cai
# (mínimo de 1 pod, não 2 como o "replicas" fixo anterior) e absorve picos
# escalando até 4 réplicas. Depende do metrics-server
# (observe/050-metrics-server/) para a API metrics.k8s.io.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donation
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donation
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
