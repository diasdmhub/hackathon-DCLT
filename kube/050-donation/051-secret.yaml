apiVersion: v1
kind: Secret
metadata:
  name: donation-env
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
type: Opaque
stringData:
  PORT: "8082"
  DATABASE_URL: "postgres://sol:sol@psql:5432/sol_db"
  AWS_REGION: "us-east-1"
  # Fila da AWS real (produção) - descomente e ajuste ao migrar para o SQS real
  # AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/123456789012/solidary-donations"
  # Fila do ElasticMQ rodando no cluster
  AWS_SQS_URL: "http://elasticmq:9324/queue/solidary-donations"
  # Endpoint personalizado do SDK. Aponta para o ElasticMQ em vez da AWS real.
  # Remova esta chave para voltar a usar a AWS real.
  AWS_ENDPOINT_URL: "http://elasticmq:9324"
  # Credenciais falsas exigidas pelo SDK para assinar requisições - o ElasticMQ não as valida
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"