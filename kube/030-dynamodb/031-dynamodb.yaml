apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb
  namespace: solidarytech
  labels:
    app: dynamodb
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb
  template:
    metadata:
      labels:
        app: dynamodb
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: dev
    spec:
      containers:
        - name: dynamodb
          image: docker.io/amazon/dynamodb-local:latest
          args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
          env:
            - name: DDB_LOCAL_TELEMETRY
              value: "0"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  selector:
    app: dynamodb
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dynamodb-init
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: dynamodb-init
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: dev
    spec:
      restartPolicy: OnFailure
      containers:
        - name: dynamodb-init
          image: docker.io/amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do
                echo "Aguardando o DynamoDB Local..."
                sleep 2
              done
              aws dynamodb create-table \
                --endpoint-url http://dynamodb:8000 \
                --table-name SolidaryTechVolunteers \
                --attribute-definitions AttributeName=volunteer_id,AttributeType=S \
                --key-schema AttributeName=volunteer_id,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                || echo "Tabela já existe, seguindo em frente."
