apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
type: Opaque
stringData:
  POSTGRES_USER: sol
  POSTGRES_PASSWORD: sol
  POSTGRES_DB: sol_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
data:
  init-donation-service.sql: |
    CREATE TABLE IF NOT EXISTS donations (
        id SERIAL PRIMARY KEY,
        ngo_id INT NOT NULL,
        amount NUMERIC(10, 2) NOT NULL,
        donor_name VARCHAR(100) NOT NULL,
        status VARCHAR(20) NOT NULL, -- Ex: APPROVED, PENDING
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
  init-ngo-service.sql: |
    CREATE TABLE IF NOT EXISTS ngos (
        id SERIAL PRIMARY KEY,
        name VARCHAR(150) NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        cause VARCHAR(100) NOT NULL, -- Ex: Proteção Animal, Educação, Fome
        city VARCHAR(100) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    --- Incluída idempotência mínima
    INSERT INTO ngos (name, email, cause, city) VALUES
    ('Anjos de Patas', 'contato@anjosdepatas.org', 'Proteção Animal', 'Osasco'),
    ('Educa Mais', 'info@educamais.org', 'Educação', 'São Paulo')
    ON CONFLICT (email) DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psql
  namespace: solidarytech
  labels:
    app: psql
    app.kubernetes.io/part-of: solidarytech
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: psql
  template:
    metadata:
      labels:
        app: psql
        app.kubernetes.io/part-of: solidarytech
    spec:
      containers:
        - name: psql
          image: docker.io/library/postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sol", "-d", "sol_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sol", "-d", "sol_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: psql
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
spec:
  selector:
    app: psql
  ports:
    - port: 5432
      targetPort: 5432