apiVersion: apps/v1
kind: Deployment
metadata:
  name: psql
  namespace: solidarytech
  labels:
    app: psql
    app.kubernetes.io/part-of: solidarytech
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: psql
  template:
    metadata:
      labels:
        app: psql
        app.kubernetes.io/part-of: solidarytech
    spec:
      containers:
        - name: psql
          image: docker.io/library/postgres:18-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sol", "-d", "sol_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sol", "-d", "sol_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: psql
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
spec:
  selector:
    app: psql
  ports:
    - port: 5432
      targetPort: 5432