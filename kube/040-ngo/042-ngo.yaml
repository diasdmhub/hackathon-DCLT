apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app: ngo
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngo
  template:
    metadata:
      labels:
        app: ngo
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: dev
    spec:
      initContainers:
        - name: wait-for-psql
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 psql 5432; do
                echo "Aguardando o psql..."
                sleep 2
              done
      containers:
        - name: ngo
          image: docker.io/diasdmhub/ngo:20260731011906 # {"$imagepolicy": "flux-system:ngo"}
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: ngo-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: ngo
  ports:
    - port: 8081
      targetPort: 8081
