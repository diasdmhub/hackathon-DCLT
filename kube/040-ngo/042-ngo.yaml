apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app: ngo
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngo
  template:
    metadata:
      labels:
        app: ngo
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: secondary
    spec:
      # Preferencial (não hard) para não travar o rollout com só 2 nodes: um
      # required exigiria um 3º node livre durante o maxSurge do deploy.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ngo
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-psql
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 psql 5432; do
                echo "Aguardando o psql..."
                sleep 2
              done
      containers:
        - name: ngo
          image: docker.io/diasdmhub/ngo:20260802185206 # {"$imagepolicy": "flux-system:ngo"}
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: ngo-env
          # Tracing OTLP exportado ao Alloy (namespace observe), que roteia ao Tempo
          env:
            - name: OTEL_SERVICE_NAME
              value: ngo-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observe.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Exclui as sondas de liveness/readiness e as coletas do Prometheus dos traces
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: /health,/metrics
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ngo
  namespace: solidarytech
  labels:
    app.kubernetes.io/name: ngo
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
    # Descoberto pelo job "solidarytech-service-endpoints" em
    # observe/040-prometheus/prometheus.yml (endpoint /metrics, mesma porta do
    # Service)
    prometheus.io/scrape: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: ngo
  ports:
    - port: 8081
      targetPort: 8081
