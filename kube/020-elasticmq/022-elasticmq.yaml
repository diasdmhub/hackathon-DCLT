apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: solidarytech
  labels:
    app: elasticmq
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: dev
    spec:
      containers:
        - name: elasticmq
          image: docker.io/softwaremill/elasticmq-native:latest
          ports:
            - containerPort: 9324
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 9324
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9324
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: elasticmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  selector:
    app: elasticmq
  ports:
    - port: 9324
      targetPort: 9324
