apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app: volunteer
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
spec:
  # Sem "replicas" fixo: a contagem passa a ser controlada pelo HPA
  # (063-hpa.yaml). Se o campo ficasse aqui, a cada reconciliação da
  # Kustomization "solidarytech" (5m) o Flux reaplicaria o valor fixo,
  # brigando com o HPA.
  selector:
    matchLabels:
      app: volunteer
  template:
    metadata:
      labels:
        app: volunteer
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: secondary
    spec:
      # Preferencial (não hard) para não travar o rollout com só 2 nodes: um
      # required exigiria um 3º node livre durante o maxSurge do deploy.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: volunteer
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-psql
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 psql 5432; do
                echo "Aguardando o psql..."
                sleep 2
              done
        - name: wait-for-dynamodb
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 dynamodb 8000; do
                echo "Aguardando o dynamodb..."
                sleep 2
              done
        - name: create-dynamodb-table
          # DynamoDB Local roda com -inMemory: a tabela some sempre que o pod dynamodb reinicia.
          # Recriá-la aqui (idempotente) garante que ela sempre exista antes do container principal subir,
          # sem depender de um Job avulso que não seria reexecutado em um restart futuro.
          image: docker.io/amazon/aws-cli:latest
          envFrom:
            - secretRef:
                name: volunteer-env
          command:
            - /bin/sh
            - -c
            - |
              aws dynamodb create-table \
                --endpoint-url "$AWS_ENDPOINT_URL" \
                --region "$AWS_REGION" \
                --table-name "$AWS_DYNAMODB_TABLE" \
                --attribute-definitions AttributeName=volunteer_id,AttributeType=S \
                --key-schema AttributeName=volunteer_id,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                || echo "Tabela já existe, seguindo em frente."
      containers:
        - name: volunteer
          image: docker.io/diasdmhub/volunteer:20260823004654 # {"$imagepolicy": "flux-system:volunteer"}
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: volunteer-env
          # Tracing OTLP exportado ao Alloy (namespace observe), que roteia ao Tempo
          env:
            - name: OTEL_SERVICE_NAME
              value: volunteer-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observe.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Exclui as sondas de liveness/readiness e as coletas do Prometheus dos traces
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: /health,/metrics
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app.kubernetes.io/name: volunteer
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: secondary
  annotations:
    metallb.universe.tf/allow-shared-ip: solidarytech-external
    # Descoberto pelo job "solidarytech-volunteer-metrics" em
    # observe/040-prometheus/prometheus.yml (scrape de 5m, não o padrão de
    # 15s - ver comentário no job)
    prometheus.io/scrape: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.12.11.202
  selector:
    app: volunteer
  ports:
    - port: 8083
      targetPort: 8083
