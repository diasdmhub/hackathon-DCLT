apiVersion: v1
kind: Secret
metadata:
  name: volunteer-env
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
type: Opaque
stringData:
  PORT: "8083"
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "SolidaryTechVolunteers"
  # Endpoint personalizado do SDK que aponta para o DynamoDB Local em vez da AWS real.
  # Remova esta chave para voltar a usar a AWS real.
  AWS_ENDPOINT_URL: "http://dynamodb:8000"
  # Credenciais falsas exigidas pelo SDK para assinar requisições - o DynamoDB Local não as valida
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app: volunteer
    app.kubernetes.io/part-of: solidarytech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volunteer
  template:
    metadata:
      labels:
        app: volunteer
        app.kubernetes.io/part-of: solidarytech
    spec:
      initContainers:
        - name: wait-for-psql
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 psql 5432; do
                echo "Aguardando o psql..."
                sleep 2
              done
        - name: wait-for-dynamodb
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 dynamodb 8000; do
                echo "Aguardando o dynamodb..."
                sleep 2
              done
      containers:
        - name: volunteer
          image: docker.io/diasdmhub/volunteer:latest
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: volunteer-env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: volunteer
  namespace: solidarytech
  labels:
    app.kubernetes.io/part-of: solidarytech
spec:
  type: NodePort
  selector:
    app: volunteer
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083