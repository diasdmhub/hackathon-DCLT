apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente AWS: o namespace "observe" recebe um único HelmRelease (chart
# oficial grafana/k8s-monitoring, via Flux) que substitui o Loki/Tempo/
# Prometheus locais do observe/ - o Grafana Cloud já inclui armazenamento de
# métricas, logs e traces, então nenhum PVC/StatefulSet é necessário aqui.
# Ver observe-aws/README.md.

resources:
  - 000-namespace.yaml
  - 010-helmrepository.yaml
  - 030-helmrelease.yaml
