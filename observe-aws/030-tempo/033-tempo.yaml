apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observe
  labels:
    app: tempo
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
        app.kubernetes.io/part-of: solidarytech
        Project: SolidaryTech
        Environment: dev
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: tempo
          image: docker.io/grafana/tempo:latest
          args: ["-config.file=/etc/tempo/config.yaml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  # ClusterIP, não LoadBalancer: a exposição externa (porta 3200) é a NLB
  # única provisionada por terra/modules/nlb, via TargetGroupBinding abaixo -
  # ver observe-aws/README.md. A porta 4317 (OTLP gRPC) fica só interna,
  # recebendo do Alloy via DNS do cluster.
  type: ClusterIP
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: tempo
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
spec:
  serviceRef:
    name: tempo
    port: 3200
  # Nome determinístico ("${name_prefix}-tempo-tg" em terra/modules/nlb) -
  # dispensa copiar o ARN gerado pela AWS depois do terraform apply.
  targetGroupName: solidarytech-tempo-tg
  targetType: ip
