apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observe
  labels:
    app.kubernetes.io/part-of: solidarytech
    Project: SolidaryTech
    Environment: dev
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  # gp3: StorageClass default provisionada por terra/modules/eks (EBS CSI),
  # equivalente ao "local-path" usado em observe/ (kubeadm-local).
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
