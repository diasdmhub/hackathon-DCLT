# Exemplo do Secret que o HelmRelease grafana-k8s-monitoring espera (via
# destinations.grafanaCloud.secret em 030-helmrelease.yaml, com
# secret.create: false). NÃO aplique este arquivo como está - copie-o para
# secret.yaml, preencha os valores reais e aplique manualmente
# (kubectl apply -f secret.yaml), fora do Flux. Este diretório não tem um
# secret.yaml real propositalmente: é uma credencial de verdade (token do
# Grafana Cloud), diferente do AWS_ACCESS_KEY_ID=test fake usado em kube/
# para os emuladores locais, e não deve ir para o git.
#
# Onde encontrar cada valor no Grafana Cloud:
#   username: Grafana Cloud > seu stack > Details > "Instance ID" da seção
#     OpenTelemetry (mesmo valor mostrado na página Connections > Add new
#     connection > OpenTelemetry, campo "Instance ID").
#   password: o token criado em Administration > Access Policies, com
#     escopo de escrita (metrics:write, logs:write, traces:write) - ver a
#     conversa que motivou este arquivo.
#
# As chaves precisam se chamar exatamente "username"/"password": são as
# usernameKey/passwordKey padrão do chart (destinations/otlp-values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: observe
type: Opaque
stringData:
  username: "CHANGE_ME"
  password: "CHANGE_ME"
