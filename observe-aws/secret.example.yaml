# Exemplo do Secret que o DaemonSet do Alloy espera via envFrom
# (observe-aws/020-alloy/023-alloy.yaml). NÃO aplique este arquivo como
# está - copie-o, preencha os valores reais obtidos no Grafana Cloud e
# aplique manualmente (kubectl apply -f secret.yaml), fora do Flux. Este
# diretório não tem um secret.yaml real propositalmente: é uma credencial
# de verdade (token do Grafana Cloud), diferente do AWS_ACCESS_KEY_ID=test
# fake usado em kube/ para os emuladores locais, e não deve ir para o git.
#
# Onde encontrar cada valor no Grafana Cloud:
#   Grafana Cloud > seu stack > Connections > Add new connection >
#   "Hosted Prometheus metrics" / "Hosted Loki logs" / "Hosted Tempo traces"
#   - cada página mostra a URL de push/OTLP e o "username" (instance ID)
#     específico daquele serviço.
#   O token (GRAFANA_CLOUD_API_KEY) é criado em Administration > Access
#   Policies, com escopo de escrita (metrics:write, logs:write, traces:write).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: observe
type: Opaque
stringData:
  GRAFANA_CLOUD_API_KEY: "CHANGE_ME"

  GRAFANA_CLOUD_LOKI_URL: "https://logs-prod-CHANGE_ME.grafana.net/loki/api/v1/push"
  GRAFANA_CLOUD_LOKI_USERNAME: "CHANGE_ME"

  GRAFANA_CLOUD_TEMPO_URL: "https://tempo-prod-CHANGE_ME.grafana.net:443"
  GRAFANA_CLOUD_TEMPO_USERNAME: "CHANGE_ME"

  GRAFANA_CLOUD_PROMETHEUS_URL: "https://prometheus-prod-CHANGE_ME.grafana.net/api/prom/push"
  GRAFANA_CLOUD_PROMETHEUS_USERNAME: "CHANGE_ME"
