# Idêntico a clusters/eks-aws/flux-system/gotk-sync.yaml - mesmo motivo
# (ver o comentário lá para o porquê de não usar `flux bootstrap`) e mesmo
# repositório/branch: o cluster do ambiente passivo lê o mesmo ./kube-aws
# que o ambiente ativo, sem nenhuma diferenciação de conteúdo - ver
# "Disaster Recovery" em terra/README.md e terra-dr/README.md.
#
# Aplicado pelo Terraform (../terra/modules/flux, reaplicado por
# terra-dr/main.tf, via kubectl_manifest, lendo este arquivo com file()),
# não por `kubectl apply -f` manual - ver "FluxCD via Terraform" em
# terra/README.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  # Repositório público: leitura via HTTPS anônimo, sem secretRef de token.
  url: https://github.com/diasdmhub/hackathon-DCLT.git
