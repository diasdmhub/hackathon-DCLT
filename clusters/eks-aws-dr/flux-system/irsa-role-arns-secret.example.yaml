# Template - copie para irsa-role-arns-secret.yaml (gitignored) e preencha
# com os ARNs REAIS DO AMBIENTE PASSIVO (diferentes dos de
# clusters/eks-aws/, por causa do role_name_suffix = "-dr" - ver
# terra/modules/iam), obtidos via:
#   terraform -chdir=terra-dr output -json iam_outputs
# Aplique manualmente uma única vez, depois do `flux install` no cluster do
# ambiente passivo, junto com gotk-sync.yaml e solidarytech-kustomization.yaml
# (ver terra-dr/README.md):
#   kubectl apply -f clusters/eks-aws-dr/flux-system/irsa-role-arns-secret.yaml
#
# Consumido via postBuild.substituteFrom pela Kustomization `solidarytech`
# (clusters/eks-aws-dr/solidarytech-kustomization.yaml) para preencher
# kube-aws/005-serviceaccounts.yaml - mesmo mecanismo do ambiente ativo, sem
# nenhuma alteração em kube-aws/.
apiVersion: v1
kind: Secret
metadata:
  name: irsa-role-arns
  namespace: flux-system
stringData:
  DONATION_SERVICE_ROLE_ARN: "arn:aws:iam::<ACCOUNT_ID>:role/solidarytech-donation-service-irsa-dr"
  VOLUNTEER_SERVICE_ROLE_ARN: "arn:aws:iam::<ACCOUNT_ID>:role/solidarytech-volunteer-service-irsa-dr"
