apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: solidarytech
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./kube-aws
  prune: true
  # Sem dependsOn: o AWS Load Balancer Controller (e o CRD TargetGroupBinding
  # que os TargetGroupBinding de ./kube-aws precisam) agora é aplicado pelo
  # Terraform (terra/modules/lb), não por uma Kustomization Flux - o próprio
  # Terraform garante essa ordem (module.flux depende de module.lb em
  # terra/main.tf), este objeto (aplicado pelo mesmo terra/modules/flux) só
  # existe depois que o CRD já existe.
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Substitui ${DONATION_SERVICE_ROLE_ARN}/${VOLUNTEER_SERVICE_ROLE_ARN} em
  # kube-aws/005-serviceaccounts.yaml pelos ARNs reais das roles IRSA (contêm
  # o account ID da AWS - por isso não ficam hardcoded em kube-aws/, que é
  # público). O Secret precisa estar no mesmo namespace desta Kustomization
  # (flux-system, não solidarytech) - ver
  # clusters/eks-aws/flux-system/irsa-role-arns-secret.example.yaml e
  # doc/roteiro-cluster-aws.md para como criá-lo.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: irsa-role-arns
