# Template - copie para irsa-role-arns-secret.yaml (gitignored) e preencha
# com os ARNs reais, obtidos via:
#   terraform -chdir=terra output -json iam_outputs
# Aplique manualmente uma única vez, depois do `flux install`, junto com
# gotk-sync.yaml e solidarytech-kustomization.yaml (ver
# doc/roteiro-cluster-aws.md):
#   kubectl apply -f clusters/eks-aws/flux-system/irsa-role-arns-secret.yaml
#
# Consumido via postBuild.substituteFrom pela Kustomization `solidarytech`
# (clusters/eks-aws/solidarytech-kustomization.yaml) para preencher
# kube-aws/005-serviceaccounts.yaml, sem versionar o account ID da AWS num
# repositório público.
apiVersion: v1
kind: Secret
metadata:
  name: irsa-role-arns
  namespace: flux-system
stringData:
  DONATION_SERVICE_ROLE_ARN: "arn:aws:iam::<ACCOUNT_ID>:role/solidarytech-donation-service-irsa"
  VOLUNTEER_SERVICE_ROLE_ARN: "arn:aws:iam::<ACCOUNT_ID>:role/solidarytech-volunteer-service-irsa"
